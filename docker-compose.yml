services:
  app:
    build: .
    container_name: blog-generator
    ports:
      - "3444:3444"
      - "3445:3445"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3444
      GENERATION_WEBSOCKET_HOST: 0.0.0.0
      GENERATION_WEBSOCKET_PORT: 3445
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      PROVIDER: ${PROVIDER:-ollama}
      MODEL: ${MODEL:-qwen3:8b}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_WEB_SEARCH_ENABLED: ${OLLAMA_WEB_SEARCH_ENABLED:-true}
      OLLAMA_WEB_SEARCH_MAX_RESULTS: ${OLLAMA_WEB_SEARCH_MAX_RESULTS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    volumes:
      - .:/app
      - ./data:/app/data
    restart: unless-stopped

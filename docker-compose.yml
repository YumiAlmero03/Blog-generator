services:
  app:
    build: .
    container_name: blog-generator
    ports:
      - "3444:3444"
      - "3445:3445"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3444
      GENERATION_WEBSOCKET_HOST: 0.0.0.0
      GENERATION_WEBSOCKET_PORT: 3445
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      PROVIDER: ${PROVIDER:-gemini}
      MODEL: ${MODEL:-gemini-3.1-pro-preview}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_SEARCH_MAX_RESULTS: ${TAVILY_SEARCH_MAX_RESULTS:-5}
      TAVILY_SEARCH_TIME_RANGE: ${TAVILY_SEARCH_TIME_RANGE:-week}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_WEB_SEARCH_ENABLED: ${OLLAMA_WEB_SEARCH_ENABLED:-false}
      OLLAMA_WEB_SEARCH_MAX_RESULTS: ${OLLAMA_WEB_SEARCH_MAX_RESULTS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-gemini}
      GEMINI_WEB_SEARCH_ENABLED: ${GEMINI_WEB_SEARCH_ENABLED:-true}
      GEMINI_WEB_SEARCH_MAX_RESULTS: ${GEMINI_WEB_SEARCH_MAX_RESULTS:-5}
      GEMINI_WEB_SEARCH_MODEL: ${GEMINI_WEB_SEARCH_MODEL:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      JSON_GENERATION_ATTEMPTS: ${JSON_GENERATION_ATTEMPTS:-2}
      GENERATION_MAX_ATTEMPTS: ${GENERATION_MAX_ATTEMPTS:-5}
    volumes:
      - .:/app
      - ./data:/app/data
    restart: unless-stopped

<div class="rounded-[22px] border border-sand-200 bg-white/80 p-4" data-output-views>
  <div class="mb-3 flex flex-wrap gap-2">
    <button type="button" class="inline-flex min-h-10 items-center rounded-full bg-sand-600 px-4 py-2 text-sm font-bold text-sand-50" data-output-view-button="visual">Visual</button>
    <button type="button" class="inline-flex min-h-10 items-center rounded-full border border-sand-200 bg-white px-4 py-2 text-sm font-bold text-sand-700" data-output-view-button="markdown">Markdown</button>
    <button type="button" class="inline-flex min-h-10 items-center rounded-full border border-sand-200 bg-white px-4 py-2 text-sm font-bold text-sand-700" data-output-view-button="html">HTML</button>
    <button type="button" class="inline-flex min-h-10 items-center rounded-full border border-sand-200 bg-white px-4 py-2 text-sm font-bold text-sand-700" data-output-view-button="gutenberg">Gutenberg</button>
    <button type="button" class="inline-flex min-h-10 items-center rounded-full border border-sand-200 bg-white px-4 py-2 text-sm font-bold text-sand-700" data-copy-target="htmlOutputView" data-copy-message="HTML copied.">Copy HTML</button>
  </div>
  <textarea id="markdownOutputView" readonly data-output-view-panel="markdown" class="hidden min-h-[260px] w-full rounded-2xl border border-stone-900 bg-stone-950 px-4 py-4 font-mono text-sm text-stone-50 outline-none"></textarea>
  <textarea id="htmlOutputView" readonly data-output-view-panel="html" class="hidden min-h-[260px] w-full rounded-2xl border border-stone-900 bg-stone-950 px-4 py-4 font-mono text-sm text-stone-50 outline-none"></textarea>
  <textarea id="gutenbergOutputView" readonly data-output-view-panel="gutenberg" class="hidden min-h-[260px] w-full rounded-2xl border border-stone-900 bg-stone-950 px-4 py-4 font-mono text-sm text-stone-50 outline-none"></textarea>
</div>

<script id="articleLinkContext" type="application/json">{{ {"links": links|default([]), "moneySiteUrl": money_site_url|default('')}|tojson }}</script>
<details class="rounded-2xl border border-sand-200 bg-white/80 p-4" open>
  <summary class="cursor-pointer text-sm font-bold text-sand-900">Article links — anchor text and destinations</summary>
  <div id="articleLinkList" class="mt-3 grid gap-3 text-sm text-sand-700" aria-live="polite"></div>
</details>
<input type="hidden" name="money_site_url" value="{{ money_site_url|default('') }}" />

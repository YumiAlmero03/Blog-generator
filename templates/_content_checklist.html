{% if content_checklist_items %}
  <section class="mt-5 rounded-[22px] border border-sand-200 bg-white/90 p-5 shadow-sm">
    <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h3 class="font-display text-2xl text-sand-950">Checklist</h3>
        <p class="mt-1 text-sm leading-6 text-sand-700">Mark the final steps before posting.</p>
      </div>
      <span class="rounded-full bg-sand-100 px-3 py-1 text-xs font-bold uppercase tracking-[0.08em] text-sand-700">{{ content_checklist_items|length }} item{% if content_checklist_items|length != 1 %}s{% endif %}</span>
    </div>
    <div class="grid gap-2 sm:grid-cols-2">
      {% for item in content_checklist_items %}
        <label class="flex min-h-12 cursor-pointer items-center gap-3 rounded-2xl border border-sand-200 bg-sand-50/80 px-4 py-3 text-sm font-bold text-sand-800 transition hover:border-sand-400 hover:bg-white">
          <input type="checkbox" class="h-4 w-4 rounded border-sand-400 text-sand-600 focus:ring-sand-500" />
          <span>{{ item.label }}</span>
        </label>
      {% endfor %}
    </div>
  </section>
{% endif %}
